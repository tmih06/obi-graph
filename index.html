<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta
      name="description"
      content="obi-graph: a canvas graph render engine with d3-force layout, camera pan/zoom, node dragging and selection."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>obi-graph — canvas graph engine</title>
    <script>
      // Resolve the theme before paint so the first frame matches the choice.
      (() => {
        let dark = matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          const stored = localStorage.getItem("obi-graph-theme");
          if (stored === "dark" || stored === "light") dark = stored === "dark";
        } catch {
          // Storage can be unavailable; still follow the device appearance.
        }
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
